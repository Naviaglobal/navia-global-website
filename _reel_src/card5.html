<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Instrument Sans',sans-serif;
  background:linear-gradient(160deg,#0B2C4A 0%,#0B5F8C 100%);position:relative;color:#fff}
.glow{position:absolute;top:-150px;left:50%;transform:translateX(-50%);width:1100px;height:1100px;

.btn{background:#E8314A;color:#fff;font-weight:700;font-size:40px;letter-spacing:1px;text-transform:uppercase;
  padding:34px 72px;border-radius:14px;display:inline-flex;align-items:center;gap:20px;
  box-shadow:0 16px 50px rgba(232,49,74,.4)}
.btn svg{width:46px;height:46px;fill:#fff}
.contact{position:absolute;bottom:150px;left:0;right:0;text-align:center}
.contact .wa{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:52px;color:#fff}
.contact .url{font-size:30px;color:rgba(255,255,255,.65);margin-top:6px;letter-spacing:1px}
