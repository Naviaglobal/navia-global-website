<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Instrument Sans',sans-serif;
  background:#0B2C4A;position:relative;color:#fff}
.glow{position:absolute;bottom:-200px;right:-200px;width:800px;height:800px;
  background:radial-gradient(circle,rgba(0,217,163,.14),transparent 60%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:200px 110px 300px}
.eyebrow{font-size:28px;font-weight:600;letter-spacing:6px;color:#00D9A3;text-transform:uppercase;margin-bottom:24px}
h2{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:96px;line-height:.95;
  text-transform:uppercase;margin-bottom:80px}
.row{display:flex;align-items:center;gap:32px;margin-bottom:48px}
.check{width:72px;height:72px;border-radius:50%;background:rgba(0,217,163,.15);border:2px solid #00D9A3;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check svg{width:38px;height:38px}
.row p{font-size:46px;font-weight:500;line-height:1.2}
.row p b{font-weight:700}
.zero{color:#00D9A3;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:60px;vertical-align:-4px}
.foot{position:absolute;bottom:120px;left:110px}
.brand{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:40px;letter-spacing:2px}
.brand span{color:#00D9A3}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="eyebrow">Lo que logró Jenny</div>
  <h2>Su proceso,<br>paso a paso</h2>
  <div class="row"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#00D9A3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div><p>Visa de turismo + permiso de estudio</p></div>
  <div class="row"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#00D9A3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div><p>6 meses en Reino Unido</p></div>
  <div class="row"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#00D9A3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div><p>Asesoría Navia: <span class="zero">$0</span></p></div>
</div>
<div class="foot"><div class="brand">NAVIA <span>GLOBAL</span></div></div>
</body></html>
