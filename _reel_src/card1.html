<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Instrument Sans',sans-serif;
  background:linear-gradient(150deg,#0B2C4A 0%,#0B5F8C 100%);position:relative;color:#fff}
.glow{position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:1000px;height:1000px;
  background:radial-gradient(circle,rgba(0,217,163,.18),transparent 60%);pointer-events:none}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:200px 90px 300px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:26px;font-weight:600;letter-spacing:6px;
  color:#00D9A3;text-transform:uppercase;margin-bottom:56px}
.eyebrow::before,.eyebrow::after{content:'';width:40px;height:2px;background:#00D9A3;opacity:.6}
h1{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:150px;line-height:.92;
  letter-spacing:-1px;text-transform:uppercase}
h1 .teal{color:#00D9A3}
.trophy{font-size:120px;margin-top:30px}
.divider{width:120px;height:4px;background:#00D9A3;border-radius:2px;margin:60px auto 0}
.foot{position:absolute;bottom:120px;left:0;right:0;text-align:center}
.brand{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:40px;letter-spacing:2px}
.brand span{color:#00D9A3}
.url{font-size:26px;color:rgba(255,255,255,.6);margin-top:8px;letter-spacing:1px}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="eyebrow">Casos reales</div>
  <h1>Colombiana.<br>Manchester.<br><span class="teal">Student of<br>the Week</span></h1>
  <div class="trophy">🏆</div>
  <div class="divider"></div>
</div>
<div class="foot">
  <div class="brand">NAVIA <span>GLOBAL</span></div>
  <div class="url">naviaglobal.co</div>
</div>
</body></html>
