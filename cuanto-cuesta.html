<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuanto cuesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --navy:#2c3e50; --blue:#1b4b8d; --sky:#3b97d3; --teal:#36b398; --gray:#cfd8de; }
  html,body{background:#000;}
  .s{ width:1080px; height:1080px; position:relative; overflow:hidden; font-family:'Instrument Sans',sans-serif; color:#fff;
    background: linear-gradient(150deg, var(--blue) 0%, var(--navy) 60%, #1a2530 100%); }
  .s::before{ content:""; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.04) 1.5px, transparent 1.5px); background-size:28px 28px; }
  .logo{ position:absolute; top:40px; right:48px; width:100px; z-index:9; filter:drop-shadow(0 3px 10px rgba(0,0,0,.5)); }
  .head{ position:absolute; top:64px; left:56px; right:170px; z-index:5; }
  .kick{ color:var(--teal); font-weight:700; font-size:24px; letter-spacing:4px; text-transform:uppercase; margin-bottom:12px; }
  .h1{ font-family:'Big Shoulders Display'; font-weight:900; font-size:58px; line-height:1; letter-spacing:-1px; }
  .table{ position:absolute; left:56px; right:56px; top:250px; z-index:5; display:flex; flex-direction:column; gap:20px; }
  .row{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:20px; padding:26px 30px; display:flex; justify-content:space-between; align-items:center; }
  .row .country{ font-family:'Big Shoulders Display'; font-weight:800; font-size:36px; }
  .row .inc{ font-size:20px; color:var(--gray); margin-top:6px; }
  .row .price{ text-align:right; }
  .row .price b{ font-family:'Big Shoulders Display'; font-weight:900; font-size:44px; color:var(--teal); }
  .row .price span{ display:block; font-size:16px; color:var(--gray); }
  .foot{ position:absolute; left:56px; right:56px; bottom:56px; z-index:5; background:var(--teal); color:var(--navy); border-radius:22px; padding:28px 36px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 16px 40px rgba(54,179,152,.35); }
  .foot .t{ font-family:'Big Shoulders Display'; font-weight:800; font-size:32px; }
  .foot .n{ font-family:'Big Shoulders Display'; font-weight:900; font-size:38px; }
</style>
</head>
<body>
<div class="s">
  <img class="logo" src="./logo.webp">
  <div class="head">
    <div class="kick">Sin letra pequeña</div>
    <div class="h1">¿Cuánto cuesta de verdad<br>estudiar afuera?</div>
  </div>
  <div class="table">
    <div class="row">
      <div><div class="country">🇮🇪 Irlanda</div><div class="inc">25 sem · curso+materiales+registro+seguro+examen</div></div>
      <div class="price"><b>$10M</b><span>COP</span></div>
    </div>
    <div class="row">
      <div><div class="country">🇦🇺 Australia</div><div class="inc">24 sem · curso+materiales+registro</div></div>
      <div class="price"><b>$13M</b><span>COP</span></div>
    </div>
    <div class="row">
      <div><div class="country">🇳🇿 Nueva Zelanda</div><div class="inc">24 sem · curso+materiales+registro</div></div>
      <div class="price"><b>$13M</b><span>COP</span></div>
    </div>
  </div>
  <div class="foot"><div class="t">Te armamos tu plan</div><div class="n">301 4430722</div></div>
</div>
</body>
</html>
