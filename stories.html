<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Navia Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --navy:#2c3e50; --green:#36b398; --red:#36b398; --gold:#3b97d3; --gray:#cfd8de; }
  html,body{background:#000;}
  .st{ width:1080px; height:1920px; position:relative; overflow:hidden; font-family:'Instrument Sans',sans-serif; color:#fff;
    background:
      radial-gradient(90% 40% at 82% 8%, rgba(54,179,152,.20), transparent 55%),
      radial-gradient(80% 40% at 15% 95%, rgba(59,151,211,.55), transparent 60%),
      linear-gradient(165deg,#1b4b8d 0%, var(--navy) 45%, #1a2530 100%); }
  .st::before{ content:""; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.05) 1.5px, transparent 1.5px); background-size:30px 30px; opacity:.5; }
  .photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 22%; z-index:0; }
  .scrim{ position:absolute; inset:0; z-index:1; background:linear-gradient(to top, rgba(5,17,30,.95) 12%, rgba(6,20,35,.55) 45%, rgba(6,20,35,.55) 62%, transparent 88%); }
  .logo{ position:absolute; top:250px; left:50%; transform:translateX(-50%); width:130px; z-index:9; filter:drop-shadow(0 4px 12px rgba(0,0,0,.5)); }
  /* content lives in the safe band (y 300–1640) */
  .box{ position:absolute; left:80px; right:80px; top:640px; z-index:6; text-align:center; }
  .kick{ color:var(--green); font-weight:700; font-size:32px; letter-spacing:5px; text-transform:uppercase; margin-bottom:24px; }
  .head{ font-family:'Big Shoulders Display'; font-weight:900; font-size:110px; line-height:.9; letter-spacing:-2px; text-shadow:0 4px 24px rgba(0,0,0,.5); }
  .head .g{ color:var(--green); }
  .sub{ font-size:38px; color:#e8eef2; font-weight:500; margin-top:34px; line-height:1.35; }
  .hint{ position:absolute; left:80px; right:80px; bottom:250px; z-index:6; text-align:center; }
  .hint .badge{ display:inline-block; background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.3); border-radius:50px; padding:20px 40px; font-size:30px; font-weight:600; backdrop-filter:blur(6px); }
  .hint .arrow{ font-size:44px; color:var(--green); margin-top:16px; }
  .cta{ display:inline-block; background:var(--red); border-radius:20px; padding:26px 54px; box-shadow:0 16px 40px rgba(54,179,152,.4);
    font-family:'Big Shoulders Display'; font-weight:800; font-size:44px; }
  .wa{ position:absolute; left:0; right:0; bottom:150px; z-index:6; text-align:center; font-size:30px; color:var(--gray); font-weight:600; letter-spacing:1px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const s = parseInt(new URLSearchParams(location.search).get('s') || '1');
  const LOGO='./logo.webp';
  function shell(inner, photo){
    const bg = photo ? `<img class="photo" src="${photo}"><div class="scrim"></div>` : '';
    return `<div class="st">${bg}<img class="logo" src="${LOGO}">${inner}</div>`;
  }
  const S = {
    1: shell(`<div class="box"><div class="kick">Lunes</div>
        <div class="head">¿A cuál te<br>irías tú?</div>
        <div class="sub">Irlanda · Australia · Nueva Zelanda<br>Vota en la encuesta 👇</div></div>`),
    2: shell(`<div class="box"><div class="kick">Martes</div>
        <div class="head">Historias<br><span class="g">reales</span></div>
        <div class="sub">Jenny fue "Student of the Week" en su curso 🎓<br>¿Quieres ser el próximo?</div></div>
        <div class="wa">WhatsApp 301 4430722 · @navia.global</div>`, './g3.png'),
    3: shell(`<div class="box"><div class="kick">Miércoles · Últimos cupos</div>
        <div class="head">Cupos de<br><span class="g">septiembre</span></div>
        <div class="sub">Se están cerrando.<br>Asegura el tuyo hoy.</div></div>
        <div class="hint"><span class="cta">Escríbenos por WhatsApp</span></div>`),
    4: shell(`<div class="box"><div class="kick">Jueves</div>
        <div class="head">¿Qué te<br>frena para<br><span class="g">irte?</span></div>
        <div class="sub">Cuéntanos honestamente 👇<br>Te respondemos sin rodeos.</div></div>`),
    5: shell(`<div class="box"><div class="kick">Viernes</div>
        <div class="head">Estudia inglés<br>en <span class="g">Irlanda</span></div>
        <div class="sub">Europa + inglés + trabajo legal.<br>Mira el reel 🎬</div></div>
        <div class="hint"><span class="cta">Escríbenos por WhatsApp</span></div>
        <div class="wa">301 4430722 · Asesoría 100% gratis</div>`, './g3.png'),
    6: shell(`<div class="box"><div class="kick">Sábado</div>
        <div class="head">¿Sabes cuánto<br>puedes <span class="g">ahorrar</span>?</div>
        <div class="sub">Adivina el costo del curso 👇<br>y sorpréndete.</div></div>`, './g1.png'),
    7: shell(`<div class="box"><div class="kick">Domingo</div>
        <div class="head">Tu <span class="g">2027</span><br>empieza hoy</div>
        <div class="sub">Asegura tu cupo para el intake de enero.<br>Tu asesoría es 100% gratis.</div></div>
        <div class="hint"><span class="cta">Escríbenos por WhatsApp</span></div>
        <div class="wa">301 4430722 · @navia.global</div>`),
  };
  document.getElementById('root').innerHTML = S[s] || S[1];
</script>
</body>
</html>
