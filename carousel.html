<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Navia Carrusel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --navy:#2c3e50; --green:#36b398; --red:#36b398; --gold:#3b97d3; --gray:#cfd8de; }
  html,body{background:#000;}
  .s{ width:1080px; height:1080px; position:relative; overflow:hidden; font-family:'Instrument Sans',sans-serif; color:#fff; }
  .grad{ background:
      radial-gradient(90% 45% at 82% 6%, rgba(54,179,152,.20), transparent 55%),
      radial-gradient(80% 45% at 12% 96%, rgba(59,151,211,.55), transparent 60%),
      linear-gradient(160deg,#1b4b8d 0%, var(--navy) 45%, #1a2530 100%); }
  .grad::before{ content:""; position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,.05) 1.5px, transparent 1.5px); background-size:30px 30px; opacity:.5; }
  .arc{ position:absolute; inset:0; z-index:1; }
  .logo{ position:absolute; top:40px; right:48px; width:104px; z-index:9; filter:drop-shadow(0 3px 10px rgba(0,0,0,.55)); }
  .count{ position:absolute; bottom:40px; right:52px; z-index:9; font-size:22px; font-weight:700; color:rgba(255,255,255,.6); letter-spacing:2px; }
  .swipe{ position:absolute; bottom:40px; left:56px; z-index:9; font-size:24px; font-weight:700; color:var(--green); letter-spacing:1px; }

  /* photo slides */
  .photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 20%; z-index:0;}
  .botscrim{ position:absolute; left:0; right:0; bottom:0; height:720px; z-index:2;
    background:linear-gradient(to top, rgba(5,17,30,.97) 24%, rgba(6,20,35,.8) 52%, rgba(6,20,35,.3) 78%, transparent); }
  .topscrim{ position:absolute; top:0;left:0;right:0;height:240px;z-index:2; background:linear-gradient(to bottom, rgba(6,20,35,.7), transparent); }

  .wrapC{ position:absolute; left:56px; right:56px; bottom:74px; z-index:6; }
  .kick{ color:var(--green); font-weight:700; font-size:26px; letter-spacing:4px; text-transform:uppercase; margin-bottom:8px; text-shadow:0 2px 10px rgba(0,0,0,.6);}
  .country{ font-family:'Big Shoulders Display'; font-weight:900; font-size:104px; line-height:.86; letter-spacing:-2px; text-shadow:0 4px 24px rgba(0,0,0,.55); }
  .pl{ margin-top:18px; font-size:30px; font-weight:600; }
  .pl b{ font-family:'Big Shoulders Display'; font-weight:900; font-size:50px; color:var(--green); vertical-align:-3px; margin:0 3px; }
  .inc{ margin-top:6px; font-size:24px; color:var(--gray); font-weight:500; }

  /* graphic centered */
  .mid{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:0 90px; z-index:6; }
  .mid .k{ color:var(--green); font-weight:700; font-size:28px; letter-spacing:5px; text-transform:uppercase; margin-bottom:20px; }
  .mid .h{ font-family:'Big Shoulders Display'; font-weight:900; font-size:104px; line-height:.86; letter-spacing:-2px; }
  .mid .h .g{ color:var(--green); }
  .mid .sub{ font-size:30px; color:#e8eef2; font-weight:500; margin-top:22px; line-height:1.3; }
  .mid .big{ font-family:'Big Shoulders Display'; font-weight:800; font-size:62px; line-height:.98; }
  .flags{ display:flex; gap:24px; margin-top:44px; }
  .flags div{ border:1.5px solid rgba(255,255,255,.3); border-radius:40px; padding:14px 30px; font-size:28px; font-weight:700; }

  /* proof */
  .stat{ font-family:'Big Shoulders Display'; font-weight:900; color:var(--green); }
  .prow{ display:flex; gap:56px; margin-top:20px; }
  .prow div{ font-family:'Big Shoulders Display'; font-weight:900; font-size:96px; color:#fff; line-height:.85; }
  .prow div span{ display:block; font-family:'Instrument Sans'; font-weight:600; font-size:26px; color:#e8eef2; }

  /* CTA */
  .cta{ background:var(--red); border-radius:22px; padding:34px 54px; margin-top:50px; box-shadow:0 18px 46px rgba(54,179,152,.42); }
  .cta .t{ font-family:'Big Shoulders Display'; font-weight:800; font-size:48px; }
  .cta .n{ font-family:'Big Shoulders Display'; font-weight:900; font-size:76px; letter-spacing:1px; }
  .endlogo{ width:230px; margin-bottom:20px; filter:drop-shadow(0 8px 24px rgba(0,0,0,.5)); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const s = parseInt(new URLSearchParams(location.search).get('s') || '1');
  const LOGO = './logo.webp';
  const arcSvg = `<svg class="arc" viewBox="0 0 1080 1080" fill="none"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36b398" stop-opacity="0"/><stop offset=".5" stop-color="#36b398" stop-opacity=".5"/><stop offset="1" stop-color="#36b398" stop-opacity="0"/></linearGradient></defs><path d="M -40 230 Q 540 70 1120 260" stroke="url(#rg)" stroke-width="2.5" stroke-dasharray="3 12" stroke-linecap="round"/><circle cx="150" cy="190" r="7" fill="#36b398"/><circle cx="945" cy="206" r="7" fill="#3b97d3"/></svg>`;

  function logo(){ return `<img class="logo" src="${LOGO}">`; }
  function count(n){ return `<div class="count">${n} / 7</div>`; }

  const photo = {
    3:{ img:'./g3.png', kick:'Europa + inglés', name:'IRLANDA', weeks:'25 semanas', price:'Todo incluido', inc:'Curso + materiales + registro + seguro + examen internacional', pos:'center 22%' },
    4:{ img:'./g2.png', kick:'Calidad de vida top', name:'AUSTRALIA', weeks:'24 semanas', price:'Todo incluido', inc:'Curso + materiales + registro', pos:'center 18%' },
    5:{ img:'./g1.png', kick:'Naturaleza + calidad de vida', name:'NUEVA ZELANDA', weeks:'24 semanas', price:'Todo incluido', inc:'Curso + materiales + registro', pos:'center 20%' },
  };

  let html='';
  if (s===1){
    html = `<div class="s grad">${arcSvg}${logo()}
      <div class="mid">
        <div class="k">Estudia + Trabaja</div>
        <div class="h">3 <span class="g">PAÍSES</span></div>
        <div class="sub">donde puedes <b style="color:#fff">estudiar inglés</b> y <b style="color:#36b398">trabajar legal</b> mientras aprendes.</div>
        <div class="flags"><div>Irlanda</div><div>Australia</div><div>N. Zelanda</div></div>
      </div>
      <div class="swipe">Desliza →</div>${count(1)}</div>`;
  } else if (s===2){
    html = `<div class="s grad">${arcSvg}${logo()}
      <div class="mid">
        <div class="k">¿Lo sabías?</div>
        <div class="big">Con tu <span style="color:#36b398">visa de estudiante</span> puedes trabajar legalmente mientras aprendes inglés.</div>
        <div class="sub">Estos 3 destinos lo permiten. Te mostramos qué incluye cada uno 👇</div>
      </div>
      <div class="swipe">Desliza →</div>${count(2)}</div>`;
  } else if (photo[s]){
    const d = photo[s];
    const fs = d.name.length>8 ? '88px':'104px';
    html = `<div class="s">
      <img class="photo" src="${d.img}" style="object-position:${d.pos}">
      <div class="topscrim"></div><div class="botscrim"></div>${logo()}
      <div class="wrapC">
        <div class="kick">${d.kick}</div>
        <div class="country" style="font-size:${fs}">${d.name}</div>
        <div class="pl">Curso ${d.weeks} · <b>${d.price}</b></div>
        <div class="inc">Incluye ${d.inc}</div>
      </div>${count(s)}</div>`;
  } else if (s===6){
    html = `<div class="s grad">${arcSvg}${logo()}
      <div class="mid">
        <div class="k">¿Por qué con Navia?</div>
        <div style="font-family:'Big Shoulders Display';font-weight:900;font-size:150px;line-height:.8;color:#36b398;text-shadow:0 6px 30px rgba(54,179,152,.35)">+9</div>
        <div style="font-size:34px;font-weight:700;margin-top:2px">años de experiencia de Samuel asesorando estudiantes</div>
        <div class="prow"><div>100%<span>asesoría gratis</span></div><div>3<span>países work &amp; study</span></div></div>
        <div class="sub" style="font-style:italic;margin-top:40px">Una agencia de ex-estudiantes, para estudiantes.</div>
      </div>${count(6)}</div>`;
  } else if (s===7){
    html = `<div class="s grad">${arcSvg}
      <div class="mid">
        <img class="endlogo" src="${LOGO}" style="width:190px;margin-bottom:14px">
        <div class="h" style="font-size:76px">¿Listo para<br>dar el paso?</div>
        <div class="sub" style="color:#36b398;font-weight:700;letter-spacing:2px">TU ASESORÍA ES 100% GRATIS</div>
        <div class="cta"><div class="t">Escríbenos por WhatsApp</div><div class="n">301 4430722</div></div>
        <div class="sub" style="margin-top:34px;font-size:28px">Guarda este post 📌 y compártelo con quien lo necesita.</div>
      </div>${count(7)}</div>`;
  }
  document.getElementById('root').innerHTML = html;
</script>
</body>
</html>
